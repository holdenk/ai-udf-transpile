[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-udf-transpile"
# a-suffix so pip needs --pre: this is ALPHA software, do not depend on it.
version = "0.1.0a0"
description = "ALPHA software (experimental, breaking, do not depend on this): AI-backed Python UDF transpilation for Apache Spark (Catalyst / Java UDF)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Holden Karau", email = "holden.karau@snowflake.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    # The bytecode backends target 3.13 instruction shapes; older
    # interpreters get fail-closed declines.
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # The inline worker verifies rewrites with Hypothesis at runtime, so a
    # plain `pip install ai-udf-transpile` without [dev] must have it.
    "hypothesis>=6.100",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    # Regenerates the README perf graph from the bench CSV (bench_graph.py).
    "matplotlib>=3.8",
    # The kms_encrypt fixture is the canonical untranspilable UDF. With boto3
    # absent, every call raises ImportError and verification fails closed;
    # with boto3 present but credential-less (tests scrub every source), the
    # NULL-guard row supplies the one successful python eval the vacuous-pass
    # guard needs and the gate accepts the hallucinated rewrite -- the
    # documented black-box limit for service-calling UDFs. Both realities are
    # pinned in tests/test_kms_encrypt.py.
    "boto3>=1.34",
]
# Documentation-only extra: Delta Lake is not installed from PyPI here.
delta = []

[project.urls]
Homepage = "https://github.com/holdenk/ai-udf-transpile"

[tool.setuptools.packages.find]
include = ["ai_udf_transpile*"]

[tool.setuptools.package-data]
ai_udf_transpile = ["resources/prompt.md", "java/*.java"]

[tool.ruff]
line-length = 110
target-version = "py311"
# Generated benchmark output (CSVs, dumps, aggregate PNGs): not source.
# EXAMPLES_TRANSPILED.md is generated too -- its python fences are the
# fixture sources verbatim, which ruff format would rewrite.
extend-exclude = ["questionable_benchmark_results", "docs/EXAMPLES_TRANSPILED.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "spark: tests that need a classic (non-Connect) SparkSession",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
