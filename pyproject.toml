[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-udf-transpile"
version = "0.1.0"
description = "AI-backed Python UDF transpilation for Apache Spark (Catalyst / Java UDF)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Holden Karau", email = "holden.karau@snowflake.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
    "ruff>=0.8",
]
# Documentation-only extra: Delta Lake is not installed from PyPI here.
delta = []

[project.urls]
Homepage = "https://github.com/holdenk/ai-udf-transpile"

[tool.setuptools.packages.find]
include = ["ai_udf_transpile*"]

[tool.setuptools.package-data]
ai_udf_transpile = ["resources/prompt.md"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "spark: tests that need a classic (non-Connect) SparkSession",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
